<header class="site-header">
    <link rel="stylesheet" href="{{ "css/header.css" | relURL }}">
    <div class="header-content">
        <a href="{{ .Site.Home.Permalink }}" class="logo">{{ .Site.Title }}</a>
        <nav class="site-nav">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}">{{ .Name }}</a>
            {{ end }}
            <a href="{{ "tags/" | relURL }}">标签</a>
            <a href="{{ "series/" | relURL }}">系列</a>
            <a href="{{ "about/" | relURL }}">关于</a>
            <a href="{{ "archives/" | relURL }}">归档</a>
        </nav>
        <button class="hamburger" id="hamburger-btn" aria-label="Menu" aria-expanded="false">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>
    </div>
    <nav class="mobile-nav" id="mobile-nav">
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
        <a href="{{ "tags/" | relURL }}">标签</a>
        <a href="{{ "series/" | relURL }}">系列</a>
        <a href="{{ "about/" | relURL }}">关于</a>
        <a href="{{ "archives/" | relURL }}">归档</a>
    </nav>
</header>

<script>
(function() {
    var btn = document.getElementById('hamburger-btn');
    var nav = document.getElementById('mobile-nav');
    if (!btn || !nav) return;
    btn.addEventListener('click', function() {
        var expanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', !expanded);
        btn.classList.toggle('is-active');
        nav.classList.toggle('is-open');
    });
})();
</script>
