<header class="site-header">
    <link rel="stylesheet" href="{{ "css/header.css" | relURL }}">
    <div class="header-content">
        <a href="{{ .Site.Home.Permalink }}" class="logo">{{ .Site.Title }}</a>
        <nav class="site-nav">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}">{{ .Name }}</a>
            {{ end }}
            <a href="{{ "tags/" | relURL }}">Tags</a>
            <a href="{{ "series/" | relURL }}">Series</a>
            <a href="{{ "about/" | relURL }}">About</a>
            <a href="{{ "archives/" | relURL }}">Archives</a>
        </nav>
    </div>
</header>
