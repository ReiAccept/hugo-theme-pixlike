{{ define "main" }}
<main class="main-content">
    <link rel="stylesheet" href="{{ "css/about.css" | relURL }}">
    <div class="container">
        <article class="about-page">
            <div class="about-header">
                <h1 class="about-title">{{ .Title }}</h1>
            </div>
            <div class="about-body">
                {{ .Content }}
            </div>
        </article>
    </div>
</main>
{{ end }}
